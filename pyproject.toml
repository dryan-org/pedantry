[project]
name = "pedantry"
version = "2.0.1"
description = "Shared lint and format configuration, synced into repos by the pedantry CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.21.1",
]

[project.scripts]
pedantry = "pedantry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pedantry"]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "vulture>=2.13",
    "pytest>=9.1.1",
    "ty>=0.0.90",
]

[tool.pedantry]
version = "2.0.1"
types = ["python", "typescript", "css"]

# >>> pedantry
# pedantry 2.0.1: managed by pedantry sync, do not edit.
[tool.ruff]
# Oldest Python this repo supports: [project] requires-python, else 3.13
target-version = "py314"

# Same as Black
line-length = 88

# Exclude common directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
    ".pytest_cache",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`), pyflakes (`F`), isort (`I`), and more
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]

# Ignore specific rules if needed
ignore = []

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect line ending
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# Files to check
include = ["src"]

# Files to exclude from type checking
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "venv",
    "dist",
    "build",
]

[tool.ty.rules]
# All rules default to "error" unless specified otherwise.
# Example: possibly-unresolved-reference = "warn"

[tool.ty.terminal]
# Output format: "full" (default) or "concise"
output-format = "full"

# Treat warnings as errors
error-on-warning = false

[tool.vulture]
# Minimum confidence for reporting unused code (0-100)
min_confidence = 80

# Ignore certain patterns
ignore_names = [
    "*_test.py",
    "test_*.py",
]

# Paths to exclude
exclude = [
    ".venv/",
    "venv/",
    "node_modules/",
    "migrations/",  # Django migrations
]
# <<< pedantry
