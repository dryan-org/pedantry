# pedantry 2.0.0: managed by pedantry sync, do not edit.
# Repo-specific hooks go in lefthook-local.yml, which lefthook merges in.
pre-commit:
  parallel: false
  commands:
    # Format files
    prettier:
      glob: "*.{js,ts,json,css,html,md,yml,yaml}"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && [ ! -L "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || npx prettier --write $FILES
      stage_fixed: true

    # Lint JavaScript and TypeScript
    eslint:
      glob: "*.{js,ts,json}"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || npx eslint --fix $FILES
      stage_fixed: true

    # Lint CSS
    stylelint:
      glob: "*.css"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || npx stylelint --fix $FILES
      stage_fixed: true

    # Format Python
    ruff-format:
      glob: "*.py"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || uv run ruff format $FILES
      stage_fixed: true

    # Lint Python
    ruff-check:
      glob: "*.py"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || uv run ruff check --fix $FILES
      stage_fixed: true

    # Find dead Python code
    vulture:
      glob: "*.py"
      run: |
        FILES=$(for f in {staged_files}; do
          [ -f "$f" ] && echo "$f"
        done)
        [ -z "$FILES" ] || uv run vulture $FILES
      stage_fixed: false # reports only, fixes nothing
